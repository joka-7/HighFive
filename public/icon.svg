<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#00B894"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so the icon works as a maskable icon (safe zone is the centre 80%) -->
  <rect width="512" height="512" fill="url(#g)"/>
  <text x="256" y="340" font-size="240" text-anchor="middle"
        font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">✋</text>
</svg>
