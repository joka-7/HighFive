<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#00B894"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so it works as a maskable icon (safe zone = centre 80%) -->
  <rect width="512" height="512" fill="url(#g)"/>
  <!-- High-five hand, built from vector shapes (no emoji font needed) -->
  <g fill="#ffffff">
    <!-- palm -->
    <rect x="168" y="250" width="176" height="150" rx="44"/>
    <!-- four fingers -->
    <rect x="176" y="150" width="36" height="160" rx="18"/>
    <rect x="220" y="120" width="36" height="190" rx="18"/>
    <rect x="264" y="130" width="36" height="180" rx="18"/>
    <rect x="308" y="160" width="36" height="150" rx="18"/>
    <!-- thumb -->
    <rect x="120" y="248" width="120" height="36" rx="18" transform="rotate(-42 180 266)"/>
  </g>
</svg>
