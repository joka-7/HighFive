# Hand-written notes for docs/STRUCTURE.md's generated tree.
# gen_tree.py derives a note from each file itself where it can (frontmatter,
# heading, docstring); .ts/.tsx source files have none of those, so directory-
# and file-level orientation lives here instead. Always overrides a derived note.

[notes]
"api" = "Vercel Serverless Functions — built independently of the Vite app, type-checked by tsconfig.api.json"
"api/_lib" = "Helpers shared by the functions; Vercel skips underscore paths, so these are not deployed as endpoints"
"api/mission-reminder.ts" = "Hourly push-reminder sender over reminders/{installId}; who is due is reminderLogic.ts"
"api/reminder-register.ts" = "POST: registers a browser install for push reminders (token + timezone only)"
"api/reminder.ts" = "POST: reports seen/done days for an install; DELETE: opts it out"
"android" = "Capacitor Android project wrapping the web build (see LLD, Android app)"
"android/app/src/main/java/io/github/joka7/highfive/MainActivity.java" = "Hands Google's Drive-consent result back to the sign-in plugin"
"capacitor.config.json" = "Capacitor app id, name and web build folder for the Android app"
"tsconfig.api.json" = "Strict type-check for api/ (Node), run by `npm run typecheck`"
"e2e" = "Playwright end-to-end specs, run via `npm run test:e2e`"
"public" = "Static assets + PWA manifest/service worker, served as-is by Vite"
"scripts" = "Content generation (`npm run content` rebuilds src/data/offline/*.json), the content audit and the Android icon generator"
"scripts/audit-content.mjs" = "`npm run content:audit`: loads the shipped content and writes docs/CONTENT-AUDIT.md (or checks it with --check)"
"scripts/content-audit.mjs" = "The audit's pure rules: CEFR list parsing, level fit, inflection-aware example check, passage difficulty, report rendering"
"scripts/content/cefr" = "Open CEFR reference word lists (CEFR-J A1–B2, Octanove C1/C2) used only by the content audit"
"scripts/gen-android-icons.mjs" = "Renders the Android launcher icons and splash screens from public/icon-512.png"
"scripts/content" = "Source word banks/passages the content generator reads"
"src" = "The Vite app: screens, components, state (useLingo), and content/offline services"
"src/components" = "Shared UI: cards, quiz runner, error boundary"
"src/data" = "Curriculum data (word banks, topics, videos) and the bundled offline content set"
"src/data/offline" = "Bundled per-level (A1-C2) quiz/listening/reading/speaking content, used offline-first"
"src/hooks" = "Small reusable React hooks (local reminders, online-status)"
"src/screens" = "One file per app screen/route"
"src/services" = "External integrations: AI provider, Drive sync, TTS/ASR, push and Android reminders, prefs, PWA"
"src/store" = "useLingo — the app's central state/context provider"
"src/utils" = "Pure logic: spaced-repetition (SRS), scoring, cycles, missions, backup/restore"

# Generated by `python .ai/bin/ai-sync` from ai-config.toml. Without these the
# tree derives each one's note from its first heading — all four say
# "AGENTS.md", which tells a reader nothing they can't see from the filename.
"AGENTS.md" = "The compiled coding rules every AI assistant reads — generated, do not hand-edit"
"CLAUDE.md" = "Claude Code's copy of AGENTS.md (generated)"
"GEMINI.md" = "Gemini CLI's copy of AGENTS.md (generated)"
".github/copilot-instructions.md" = "Copilot's copy of AGENTS.md (generated)"
"ai-config.toml" = "Which rule fragments and target tools ai-sync compiles for this repo"
"ai-config.local.md" = "Project-specific rules appended verbatim to the generated AGENTS.md"
".ai" = "ogen-ai submodule — the shared source of rules, skills and the ai-sync generator"
