name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: App-shell bundle size gate
        # The per-level-per-quarter offline content chunks (dist/assets/content/)
        # scale with content, not app code, so they're excluded here — this
        # only guards the JS every visitor downloads regardless of level.
        run: |
          total=$(find dist/assets -maxdepth 1 -name "*.js" -exec du -cb {} + | tail -1 | cut -f1)
          limit=$((1024 * 1024))
          echo "App-shell JS total: ${total} bytes (limit: ${limit} bytes)"
          if [ "$total" -gt "$limit" ]; then
            echo "::error::App-shell JS bundle grew past ${limit} bytes (was ${total}). Check for an un-code-split dependency or accidental import."
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
