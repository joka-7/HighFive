name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle size gate (app shell JS, excluding content chunks)
        run: |
          # Fail if any non-content JS chunk exceeds 600 KB (uncompressed).
          # Content offline packs live under assets/content/ and are gated
          # separately by the PWA precache ignore list.
          node -e "
            const fs = require('fs');
            const path = require('path');
            const limit = 600 * 1024;
            const root = 'dist/assets';
            const files = fs.readdirSync(root).filter((f) => f.endsWith('.js'));
            const oversized = files
              .map((f) => ({ f, size: fs.statSync(path.join(root, f)).size }))
              .filter((x) => x.size > limit);
            if (oversized.length) {
              console.error('Bundle size gate failed:');
              for (const x of oversized) console.error(' ', x.f, (x.size/1024).toFixed(1) + ' KB');
              process.exit(1);
            }
            console.log('Bundle size gate OK (' + files.length + ' shell JS files under 600 KB)');
          "

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
